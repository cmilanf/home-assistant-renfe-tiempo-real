# Run `pre-commit install` once to enable these on every commit.
# Run `pre-commit run --all-files` to check the whole repository.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Everyday hygiene, so the hook earns its keep on normal commits.
      - id: trailing-whitespace
        exclude: \.svg$
      - id: end-of-file-fixer
        exclude: \.(svg|png)$
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-case-conflict
      # The manifest, translations and fixtures are all machine read.
      - id: check-json
      - id: check-yaml
      # Keeps a stray .venv or diagnostics dump from being committed.
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Kept in step with the ruff version used locally and in CI.
    rev: v0.16.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      # The Renfe endpoints need no credentials, so this is a guard against a
      # future contribution carrying a token, not a check on today's code.
      - id: gitleaks
